[package]
name = "reel-app"
description = "Reel's Dioxus desktop app, with vendored Rust/UI components."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Adds a scripted test of the running app, which never ships. See src/self_test.rs.
self-test = ["dep:png"]

[dependencies]
# Rust/UI's Button renders a router Link when given an href.
dioxus = { workspace = true, features = ["desktop", "router"] }
icons.workspace = true
reel-core.workspace = true
serde_json.workspace = true
strum.workspace = true
tw_merge.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["time", "sync", "rt"] }
png = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-quartz-core"] }
objc2-foundation = "0.3"
global-hotkey = "0.7"
pollster.workspace = true
reel-capture.workspace = true
reel-media.workspace = true
reel-motion.workspace = true
reel-render.workspace = true
rfd = "0.17"
wgpu.workspace = true

[dev-dependencies]
dioxus-ssr.workspace = true

[lints]
workspace = true
