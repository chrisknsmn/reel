[package]
name = "reel-captions"
description = "Whisper transcription, segmentation and caption layout. No UI or GPU dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Builds whisper.cpp, which takes a while and needs CMake and Clang.
whisper = ["dep:whisper-rs"]

[dependencies]
reel-core.workspace = true
sha1_smol = "1"
ureq = "3"
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
reel-media.workspace = true

[lints]
workspace = true
