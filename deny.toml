# Dependency policy. Run with: cargo deny check

[advisories]
version = 2
yanked = "deny"
# None of these has a safe upgrade. Review on every upgrade of what brings them in: Dioxus, or for
# ttf-parser, cosmic-text. All are notices that a crate is unmaintained, not known vulnerabilities.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, via the gtk3-rs crates dioxus-desktop uses on Linux" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, via dioxus-desktop's image dependencies" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained, via wry" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, via fontdb in cosmic-text 0.19, the latest. It reads the fonts installed on the machine" },
]

[licenses]
version = 2
# Reel's own crates are AGPL-3.0-only and unpublished, so this list only covers dependencies.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only for this one crate: it's Mozilla's list of root certificates, used to check the download of a
# speech model, and this is the permissive licence that data comes under.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
# The Dioxus and GTK trees bring duplicates that we don't control.
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { crate = "mp4", reason = "Avoided in BUILD_PLAN.md: no release since 2023" },
    { crate = "rdev", reason = "Avoided in BUILD_PLAN.md: no release since 2023" },
    # dioxus =0.7.9 only asks for ^0.7.9 of these, so `cargo update` would quietly move them.
    { crate = "dioxus-core:>0.7.9", reason = "Dioxus is pinned to 0.7.9. Move this ban when upgrading deliberately." },
    { crate = "dioxus-desktop:>0.7.9", reason = "Dioxus is pinned to 0.7.9. Move this ban when upgrading deliberately." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
