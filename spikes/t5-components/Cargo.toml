# Disposable test app for T5 in BUILD_PLAN.md. See README.md here, and docs/spikes.md for the results.
[package]
name = "t5-components"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
dioxus = { version = "=0.7.9", features = ["desktop", "router"] }
icons = { version = "0.19", features = ["dioxus"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
png = "0.18"
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
tw_merge = "0.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
