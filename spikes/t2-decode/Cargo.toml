# Disposable test app for T2 in BUILD_PLAN.md. See README.md here, and docs/spikes.md for the results.
[package]
name = "t2-decode"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
ffmpeg-next = "9"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
pollster = "0.4"
serde_json = "1"
wgpu = "30"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
