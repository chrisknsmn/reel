[workspace]
resolver = "3"
members = ["crates/*"]
# `dx serve --platform desktop` picks its package from here when run at the repo root.
# This also narrows bare cargo commands to reel-app, so pass --workspace for everything.
default-members = ["crates/reel-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/chrisknsmn/reel"
publish = false

[workspace.dependencies]
# Reel's own crates.
reel-captions = { path = "crates/reel-captions", version = "0.1.0" }
reel-capture = { path = "crates/reel-capture", version = "0.1.0" }
reel-core = { path = "crates/reel-core", version = "0.1.0" }
reel-media = { path = "crates/reel-media", version = "0.1.0" }
reel-motion = { path = "crates/reel-motion", version = "0.1.0" }
reel-render = { path = "crates/reel-render", version = "0.1.0" }

# Sound.
cpal = "0.18"

# Rendering.
wgpu = "30"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
cosmic-text = "0.19"
tiny-skia = "0.12"

# Exact pin, matching Rust/UI. This only pins the top-level crate: its sub-crates ask for ^0.7.9,
# so Cargo.lock holds them at 0.7.9 and deny.toml fails CI if they move. When upgrading, change
# these two lines, the bans in deny.toml and the installed dioxus-cli together.
dioxus = "=0.7.9"
dioxus-ssr = "=0.7.9"

# Used by the vendored Rust/UI components. See VENDORED.md.
icons = { version = "0.19", features = ["dioxus"] }
tw_merge = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }

# Tests only.
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
